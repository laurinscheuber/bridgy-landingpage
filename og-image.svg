<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4c1d95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glass morphism overlay -->
  <rect x="100" y="100" width="1000" height="430" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Bridgy Logo/Brand -->
  <text x="600" y="200" font-family="Inter, sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="url(#textGrad)">BRIDGY</text>
  
  <!-- Tagline -->
  <text x="600" y="260" font-family="Inter, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.8)">From Figma to Production — Automatically</text>
  
  <!-- Visual Elements -->
  <circle cx="400" cy="380" r="60" fill="url(#accentGrad)" opacity="0.8"/>
  <text x="400" y="390" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="white">FIGMA</text>
  
  <!-- Arrow -->
  <path d="M480 380 L720 380" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10,5"/>
  <polygon points="720,375 730,380 720,385" fill="url(#accentGrad)"/>
  
  <circle cx="800" cy="380" r="60" fill="url(#accentGrad)" opacity="0.8"/>
  <text x="800" y="390" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="white">CODE</text>
  
  <!-- Stats -->
  <text x="300" y="480" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="url(#accentGrad)">65% Faster</text>
  <text x="600" y="480" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="url(#accentGrad)">Zero Errors</text>
  <text x="900" y="480" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="url(#accentGrad)">100% Sync</text>
  
  <!-- Bottom text -->
  <text x="600" y="560" font-family="Inter, sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="rgba(255,255,255,0.6)">Automated Design-to-Code Plugin for Modern Teams</text>
</svg>